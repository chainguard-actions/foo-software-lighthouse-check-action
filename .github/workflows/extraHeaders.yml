name: Test Extra Headers
on: [pull_request]

permissions: {}

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    env:
      ACTIONS_ALLOW_UNSECURE_COMMANDS: true
    steps:
      - uses: actions/checkout@61b9e3751b92087fd0b06925ba6dd6314e06f089 # master
      - env:
          GITHUB_WORKSPACE_PATH: ${{ github.workspace }}
        run: mkdir -p "$GITHUB_WORKSPACE_PATH/tmp/artifacts"
      - uses: amondnet/vercel-action@9471a567336164bdfd4c8f070039943d597f6f5c # master
        id: vercelAction
        with:
          github-comment: false
          vercel-token: ${{ secrets.ZEIT_NOW_TOKEN }}
          vercel-org-id: ${{ secrets.ZEIT_NOW_ORG_ID }}
          vercel-project-id: ${{ secrets.ZEIT_NOW_PROJECT_ID }}
      - name: Run Lighthouse
        uses: ./
        with:
          extraHeaders: '{ "x-test-1": "hello world", "x-test-2": "foo" }'
          fooApiToken: ${{ secrets.LIGHTHOUSE_CHECK_API_TOKEN }}
          outputDirectory: ${{ github.workspace }}/tmp/artifacts
          urlsJson: '[[\"cf8b27b3-ccb8-4477-83b6-ded2c375f977\", \"${{ steps.vercelAction.outputs.preview-url }}\"]]'
      - name: Upload artifacts
        uses: actions/upload-artifact@0c366cb4fc8897159c94880f94b55bc716ad6a66 # master
        with:
          name: Lighthouse reports
          path: ${{ github.workspace }}/tmp/artifacts
