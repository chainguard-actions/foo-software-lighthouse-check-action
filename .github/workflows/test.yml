name: Test Lighthouse Check
on: [pull_request]

permissions: {}

jobs:
  lighthouse-check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@61b9e3751b92087fd0b06925ba6dd6314e06f089 # master
    - env:
        WORKSPACE: ${{ github.workspace }}
      run: mkdir -p "$WORKSPACE/tmp/artifacts"
    - name: Run Lighthouse
      uses: ./
      with:
        awsAccessKeyId: ${{ secrets.LIGHTHOUSE_CHECK_AWS_ACCESS_KEY_ID }}
        awsBucket: ${{ secrets.LIGHTHOUSE_CHECK_AWS_BUCKET }}
        awsRegion: ${{ secrets.LIGHTHOUSE_CHECK_AWS_REGION }}
        awsSecretAccessKey: ${{ secrets.LIGHTHOUSE_CHECK_AWS_SECRET_ACCESS_KEY }}
        device: all
        gitAuthor: ${{ github.actor }}
        gitBranch: ${{ github.ref }}
        gitHubAccessToken: ${{ secrets.GITHUB_TOKEN }}
        maxRetries: 1
        outputDirectory: ${{ github.workspace }}/tmp/artifacts
        urls: 'https://www.foo.software,https://www.foo.software/tag/articles/'
        sha: ${{ github.sha }}
        slackWebhookUrl: ${{ secrets.LIGHTHOUSE_CHECK_WEBHOOK_URL }}
    - name: Upload artifacts
      uses: actions/upload-artifact@0c366cb4fc8897159c94880f94b55bc716ad6a66 # master
      with:
        name: Lighthouse reports
        path: ${{ github.workspace }}/tmp/artifacts
