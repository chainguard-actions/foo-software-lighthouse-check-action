name: Test locale, max retries, and overrides inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create overrides JSON file
        run: |
          echo '{}' > /tmp/overrides.json
      - id: action
        uses: .
        continue-on-error: true
        with:
          urls: 'https://www.example.com'
          locale: 'en'
          maxRetries: '2'
          overridesJsonFile: '/tmp/overrides.json'
          verbose: 'true'
      - name: Assert action ran (locale, maxRetries, overridesJsonFile inputs accepted)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with locale/maxRetries/overridesJsonFile inputs (outcome: $OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
