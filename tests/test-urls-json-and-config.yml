name: Test urlsJson and configFile inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create config and urlsJson files
        run: |
          echo '[{"url":"https://www.example.com"}]' > /tmp/urls.json
          echo '{"urls":"https://www.example.com","verbose":true}' > /tmp/lighthouse-config.json
      - id: action-urlsjson
        uses: .
        continue-on-error: true
        with:
          urlsJson: '[{"url":"https://www.example.com"}]'
          verbose: 'true'
      - name: Assert action ran with urlsJson
        env:
          OUTCOME: ${{ steps.action-urlsjson.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with urlsJson input (outcome: $OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
      - id: action-configfile
        uses: .
        continue-on-error: true
        with:
          configFile: '/tmp/lighthouse-config.json'
          verbose: 'true'
      - name: Assert action ran with configFile
        env:
          OUTCOME: ${{ steps.action-configfile.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with configFile input (outcome: $OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
