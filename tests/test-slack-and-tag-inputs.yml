name: Test Slack webhook, SHA, and tag inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          urls: 'https://www.example.com'
          sha: 'abc1234567890abcdef1234567890abcdef12345'
          slackWebhookUrl: 'https://hooks.slack.com/services/FAKE/FAKE/FAKETOKEN'
          tag: 'build-1'
          verbose: 'true'
      - name: Assert action ran (sha, slackWebhookUrl, tag inputs accepted)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with sha/slackWebhookUrl/tag inputs (outcome: $OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
