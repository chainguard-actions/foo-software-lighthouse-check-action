name: Test git author, branch, and foo API token inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          urls: 'https://www.example.com'
          fooApiToken: 'fake-foo-api-token'
          gitAuthor: 'test-git-author'
          gitBranch: 'main'
          gitHubAccessToken: 'fake-github-access-token'
          verbose: 'true'
      - name: Assert action ran (git and foo API inputs accepted)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with git/foo API inputs (outcome: $OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
