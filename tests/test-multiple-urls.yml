name: Test multiple URLs audit
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          urls: 'https://www.google.com,https://www.example.com'
          verbose: 'true'
        continue-on-error: true
      - name: Assert action ran with multiple URLs
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          # The action should either succeed or fail with a Lighthouse error,
          # but it must not crash with an unhandled exception or missing module.
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran with multiple URLs (outcome=${{ steps.action.outcome }})"
