name: Test urlsJson input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          urlsJson: '[{"url":"https://www.example.com"}]'
          verbose: 'true'
        continue-on-error: true
      - name: Assert action ran with urlsJson
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran with urlsJson input (outcome=${{ steps.action.outcome }})"
