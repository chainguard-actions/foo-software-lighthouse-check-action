name: Test comment URL and extra headers inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          urls: 'https://www.example.com'
          commentUrl: 'https://api.github.com/repos/example/repo/commits/abc123/comments'
          emulatedFormFactor: 'desktop'
          extraHeaders: '{"Authorization":"Bearer token123"}'
          verbose: 'true'
      - name: Assert action ran (comment URL and headers inputs accepted)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with commentUrl/emulatedFormFactor/extraHeaders inputs (outcome: $OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
