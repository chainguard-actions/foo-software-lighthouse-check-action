name: Test foo API token and throttling inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create overrides JSON file
        run: |
          mkdir -p /tmp/lighthouse-overrides
          cat > /tmp/lighthouse-overrides/overrides.json <<'EOF'
          {
            "config": {},
            "options": {}
          }
          EOF
      - id: action
        uses: .
        continue-on-error: true
        with:
          urls: 'https://www.example.com'
          apiToken: 'legacy-api-token-value'
          fooApiToken: 'foo-api-token-value'
          throttling: 'mobileSlow4G'
          throttlingMethod: 'simulate'
          overridesJsonFile: '/tmp/lighthouse-overrides/overrides.json'
          verbose: 'true'
      - name: Assert action ran
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with foo API token and throttling inputs"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
