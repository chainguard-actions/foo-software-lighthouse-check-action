name: Test advanced config inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create overrides JSON file
        run: |
          echo '{}' > /tmp/overrides.json
      - id: action
        uses: .
        continue-on-error: true
        with:
          urls: 'https://www.example.com'
          fooApiToken: 'foo-api-token-example'
          locale: 'en'
          maxRetries: '2'
          overridesJsonFile: '/tmp/overrides.json'
          slackWebhookUrl: 'https://hooks.slack.com/services/EXAMPLE/EXAMPLE/EXAMPLE'
          tag: 'build-1'
          throttlingMethod: 'simulate'
          throttling: 'mobileSlow4G'
          timeout: '10'
          wait: 'true'
          extraHeaders: '{"X-Custom-Header":"test-value"}'
          verbose: 'true'
      - name: Assert action ran (advanced config inputs accepted)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with advanced config inputs (outcome: $OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
